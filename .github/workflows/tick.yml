# Every hour, wake up the server and ask it to run the daily job.
# The server decides what to do: the morning plan (once, after your run time)
# or just the conflict check. Running it more often is safe (the job is idempotent).
#
# Setup (repo → Settings → Secrets and variables → Actions → New repository secret):
#   TOUCHBASE_URL  = https://your-app.onrender.com   (no trailing slash)
#   CRON_SECRET    = the same value as CRON_SECRET on Render
#
# This repo is public, so its logs are public:
#   - the URL and secret are GitHub secrets (masked in logs)
#   - the response body is thrown away (-o /dev/null), so nothing personal is printed
name: Hourly tick

on:
  schedule:
    - cron: "7 * * * *" # 7 minutes past every hour (UTC)
  workflow_dispatch: {}

# This workflow needs no access to the repository at all.
permissions: {}

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the tick endpoint
        env:
          TOUCHBASE_URL: ${{ secrets.TOUCHBASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TOUCHBASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "TOUCHBASE_URL or CRON_SECRET is not set yet. Skipping."
            exit 0
          fi
          # A free Render server sleeps when idle and can take ~1 minute to wake up,
          # so retry a few times with a generous timeout.
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TOUCHBASE_URL}/api/internal/tick")
          echo "Server replied with HTTP ${status}"
          test "$status" = "200"
